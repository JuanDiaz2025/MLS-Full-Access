<title>Property Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#eef0f4; --surface:#ffffff; --surface-2:#f6f7fa; --line:#dde1e9; --line-strong:#c7cdd8;
  --ink:#18202d; --ink-2:#3b4556; --muted:#646d80; --accent:#2f4bd8; --accent-ink:#ffffff; --accent-soft:#e3e8ff;
  --s-todo:#c4c9d4; --s-todo-ink:#2a3140;
  --s-working:#f2a93b; --s-working-ink:#2b1c02;
  --s-stuck:#e2445c; --s-stuck-ink:#ffffff;
  --s-done:#1fa872; --s-done-ink:#ffffff;
  --p-low:#8fb3e8; --p-low-ink:#10223f;
  --p-medium:#6b7fe0; --p-medium-ink:#ffffff;
  --p-high:#8a3ffc; --p-high-ink:#ffffff;
  --p-critical:#3a1d6e; --p-critical-ink:#ffffff;
  /* property health */
  --h-green:#1fa872; --h-green-soft:#dff5ea; --h-green-ink:#0d5a3b;
  --h-yellow:#e79a1c; --h-yellow-soft:#fdf0d8; --h-yellow-ink:#6b4200;
  --h-red:#d8334d; --h-red-soft:#fce3e7; --h-red-ink:#8a1427;
  --h-grey:#8a93a5; --h-grey-soft:#eceef2; --h-grey-ink:#3b4556;
  /* checklist states */
  --c-done:#1fa872; --c-done-ink:#fff;
  --c-waiting:#f2a93b; --c-waiting-ink:#2b1c02;
  --c-missing:#e2445c; --c-missing-ink:#fff;
  --c-unknown:#dfe3ea; --c-unknown-ink:#3b4556;
  --c-na:#f1f2f5; --c-na-ink:#8a93a5;
  --g1:#0f8b8d; --g2:#8a3ffc; --g3:#d97706; --g4:#d6336c; --g5:#2f4bd8; --g6:#4d7c0f;
  --shadow:0 8px 28px rgba(20,28,45,.16);
  --f-display:"Schibsted Grotesk",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#10141c; --surface:#181e29; --surface-2:#1e2532; --line:#2a3342; --line-strong:#3a4558;
    --ink:#e8ecf3; --ink-2:#c3cad6; --muted:#939cae; --accent:#7b91ff; --accent-ink:#0c1230; --accent-soft:#232c52;
    --s-todo:#4a5263; --s-todo-ink:#e8ecf3;
    --h-green-soft:#12301f; --h-green-ink:#7fe0b0; --h-yellow-soft:#35280f; --h-yellow-ink:#f5c46b;
    --h-red-soft:#3a1720; --h-red-ink:#ff9aab; --h-grey-soft:#242b38; --h-grey-ink:#c3cad6;
    --c-unknown:#2f3746; --c-unknown-ink:#c3cad6; --c-na:#1e2532; --c-na-ink:#6f788a;
    --g1:#2cc3c5; --g2:#a878ff; --g3:#f59e0b; --g4:#f06595; --g5:#7b91ff; --g6:#84cc16;
    --shadow:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#10141c; --surface:#181e29; --surface-2:#1e2532; --line:#2a3342; --line-strong:#3a4558;
  --ink:#e8ecf3; --ink-2:#c3cad6; --muted:#939cae; --accent:#7b91ff; --accent-ink:#0c1230; --accent-soft:#232c52;
  --s-todo:#4a5263; --s-todo-ink:#e8ecf3;
  --h-green-soft:#12301f; --h-green-ink:#7fe0b0; --h-yellow-soft:#35280f; --h-yellow-ink:#f5c46b;
  --h-red-soft:#3a1720; --h-red-ink:#ff9aab; --h-grey-soft:#242b38; --h-grey-ink:#c3cad6;
  --c-unknown:#2f3746; --c-unknown-ink:#c3cad6; --c-na:#1e2532; --c-na-ink:#6f788a;
  --g1:#2cc3c5; --g2:#a878ff; --g3:#f59e0b; --g4:#f06595; --g5:#7b91ff; --g6:#84cc16;
  --shadow:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:20px 72px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Top bar */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:16px}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.02em;margin:0;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--muted);max-width:62ch}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 10px;height:36px;min-width:0}
.search input{border:0;background:transparent;outline:0;width:170px;max-width:44vw}
.chip{height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.btn{height:36px;padding:0 14px;border-radius:8px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
.notice{background:var(--surface);border:1px dashed var(--line-strong);border-radius:10px;padding:14px 16px;color:var(--ink-2);margin-bottom:16px}
.notice[data-tone="warn"]{border-style:solid;border-color:var(--s-working)}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{--k:var(--accent);text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px 12px;display:flex;flex-direction:column;gap:2px;transition:border-color .12s,box-shadow .12s}
.kpi b{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;letter-spacing:-.02em;color:var(--k);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.kpi small{font-size:12px;color:var(--muted);min-height:1.2em}
.kpi:hover{border-color:var(--k)}
.kpi[aria-pressed="true"]{border-color:var(--k);box-shadow:0 0 0 2px color-mix(in srgb,var(--k) 25%,transparent)}
.kpi.k-active{--k:var(--ink)} .kpi.k-week{--k:var(--accent)} .kpi.k-blocked{--k:var(--h-red)} .kpi.k-overdue{--k:var(--h-yellow)}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi b{font-size:28px}}

/* Jump bar */
.jump{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
.jump a{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);text-decoration:none;font-size:13px;font-weight:500}
.jump a:hover{border-color:var(--line-strong);color:var(--ink)}
.hdot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--h-grey)}
.hdot.green{background:var(--h-green)} .hdot.yellow{background:var(--h-yellow)} .hdot.red{background:var(--h-red)}

/* Tabs + overview */
.jump{gap:6px;margin-bottom:18px}
.jump button{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);font-size:15px;font-weight:700}
.jump button:hover{border-color:var(--line-strong);color:var(--ink)}
.jump button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.ov{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.pbox{--gc:var(--g1);display:flex;flex-direction:column;gap:10px;text-align:left;width:100%;min-height:190px;background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--gc);border-radius:14px;padding:16px 18px;transition:transform .12s,box-shadow .12s,border-color .12s}
.pbox:hover,.pbox:focus-visible{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--gc)}
.pbox .a{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.15;letter-spacing:-.01em;color:var(--ink);text-wrap:balance}
.pbox .a small{display:block;font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:13px;letter-spacing:0;margin-top:3px}
.pbox .row1{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pbox .health{pointer-events:none}
.pbox .t{font-size:13px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pbox .t b{font-weight:700;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
.pbox .t.red{color:var(--h-red-ink)}
.pbox .go{margin-top:auto;font-weight:700;color:var(--accent);font-size:13px}
@media (prefers-reduced-motion: reduce){.pbox:hover{transform:none}}
.back{border:0;background:transparent;color:var(--accent);font-weight:600;padding:0;margin:0 0 10px}

/* Groups */
.groups{display:flex;flex-direction:column;gap:30px}
.group{--gc:var(--g1);scroll-margin-top:16px}
.ghead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:8px}
.caret{width:26px;height:26px;border-radius:6px;border:0;background:transparent;color:var(--gc);display:grid;place-items:center;transition:transform .15s}
.group[data-collapsed="true"] .caret{transform:rotate(-90deg)}
.gtitle{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,4vw,32px);line-height:1.15;color:var(--gc);margin:0;letter-spacing:-.01em}
.gcity{color:var(--muted);font-weight:500;font-size:17px}
.kind{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:2px 7px;background:var(--surface)}
.health{border:0;border-radius:999px;padding:4px 11px 4px 9px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;background:var(--h-grey-soft);color:var(--h-grey-ink)}
.health.green{background:var(--h-green-soft);color:var(--h-green-ink)}
.health.yellow{background:var(--h-yellow-soft);color:var(--h-yellow-ink)}
.health.red{background:var(--h-red-soft);color:var(--h-red-ink)}
.health[disabled]{cursor:default}
.dchip{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 8px;white-space:nowrap}
.dchip.soon{border-color:var(--accent);color:var(--accent)}
.dchip.past{border-color:var(--h-red);color:var(--h-red)}
.gcount{color:var(--muted);font-size:13px}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:13px;padding:2px 4px}
.ghead .spacer{flex:1}
.battery{display:flex;height:8px;width:140px;max-width:36vw;border-radius:4px;overflow:hidden;background:var(--line)}
.battery span{display:block;height:100%}

.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gc);border-radius:10px;margin-bottom:10px}
/* brief: blocker / missing / next / dates */
.brief{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line)}
.bcell{padding:12px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.bcell:last-child{border-right:0}
.bcell label,.lab{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.bcell.blocker label{color:var(--h-red)}
.bcell.next label{color:var(--accent)}
.ta{width:100%;border:1px solid transparent;border-radius:6px;background:transparent;padding:5px 7px;margin:0 -7px;resize:none;min-height:56px;line-height:1.4;color:var(--ink);field-sizing:content;max-height:220px}
.ta:hover{border-color:var(--line)}
.ta:focus{outline:0;border-color:var(--accent);background:var(--surface)}
.ta::placeholder{color:var(--muted)}
.mini{display:flex;flex-wrap:wrap;gap:6px}
.mini input{border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:4px 7px;font-size:13px;min-width:0}
.mini input[type=text]{flex:1 1 110px}
.mini input[type=date]{font-family:var(--f-mono);font-size:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;font-size:13px}
.kv span{color:var(--muted);font-size:12px}
.kv input{width:100%;border:1px solid transparent;border-radius:5px;background:transparent;padding:3px 5px;min-width:0}
.kv input:hover{border-color:var(--line)}
.kv input:focus{outline:0;border-color:var(--accent);background:var(--surface)}
.kv input[type=date]{font-family:var(--f-mono);font-size:12px}
@media (max-width:900px){.brief{grid-template-columns:repeat(2,minmax(0,1fr))}.bcell:nth-child(2){border-right:0}.bcell:nth-child(-n+2){border-bottom:1px solid var(--line)}}
@media (max-width:560px){.brief{grid-template-columns:1fr}.bcell{border-right:0;border-bottom:1px solid var(--line)}.bcell:last-child{border-bottom:0}}

/* checklist */
.checks{padding:12px 14px 6px}
.checks-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.checks-head .tally{font-size:12px;color:var(--muted)}
.clist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px}
@media (max-width:760px){.clist{grid-template-columns:1fr}}
.citem{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 10px;align-items:start;padding:7px 0;border-top:1px solid var(--line)}
.cstate{border:0;border-radius:5px;font-size:11px;font-weight:700;padding:4px 6px;text-align:center;text-transform:uppercase;letter-spacing:.04em;width:100%}
.cstate[disabled]{cursor:default}
.cbody{min-width:0}
.clabel{font-weight:600;font-size:13.5px}
.cnote{width:100%;border:1px solid transparent;border-radius:5px;background:transparent;padding:2px 5px;margin:1px -5px 0;font-size:12.5px;color:var(--ink-2);resize:none;field-sizing:content;min-height:1.6em;line-height:1.4}
.cnote:hover{border-color:var(--line)}
.cnote:focus{outline:0;border-color:var(--accent);background:var(--surface)}
.cnote::placeholder{color:var(--muted)}
.cadd{display:flex;gap:8px;padding:8px 0 6px;border-top:1px solid var(--line)}
.cadd input{flex:1;border:1px solid transparent;border-radius:6px;background:transparent;padding:6px 8px;min-width:0}
.cadd input:focus{outline:0;border-color:var(--accent);background:var(--surface)}
.stamp{padding:8px 14px 10px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 14px}
.stamp a{color:var(--accent)}

.facts{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gc);border-radius:10px;padding:14px 16px;margin:0 0 10px;display:grid;gap:12px}
.facts dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px 18px;margin:0}
.facts dt{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.facts dd{margin:2px 0 0;font-family:var(--f-mono);font-size:13px;color:var(--ink)}
.facts .fnote{color:var(--ink-2);margin:0;max-width:75ch}
.facts .flinks{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.facts a{color:var(--accent)}
.facts h4{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.comps{width:100%;border-collapse:collapse;font-size:13px}
.comps th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:4px 10px 4px 0;border-bottom:1px solid var(--line)}
.comps td{padding:5px 10px 5px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}

.sumline{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;margin:4px 0 10px;font-size:14px;color:var(--ink-2)}
.sumline b{font-family:var(--f-display);font-size:20px;color:var(--ink)}
.sumline .stk b{color:var(--h-red)}
.cdate{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.cdate input{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:4px 6px;font-family:var(--f-mono);font-size:12px}
.blockline{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--h-red);border-radius:10px;padding:8px 12px;margin-bottom:12px}
.blockline label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--h-red);flex:none}
.blockline input{flex:1;min-width:0;border:1px solid transparent;border-radius:6px;background:transparent;padding:6px 8px;font-size:14px}
.blockline input:focus{outline:0;border-color:var(--accent)}
.notes{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.notes h3{margin:0;font-family:var(--f-display);font-size:17px}
.ncompose{display:flex;gap:8px;align-items:flex-end}
.ncompose textarea{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:8px 10px;resize:vertical;min-height:44px}
.ncompose textarea:focus{outline:0;border-color:var(--accent);background:var(--surface)}
.note{display:grid;grid-template-columns:28px 1fr;gap:10px;border-top:1px solid var(--line);padding-top:10px}
.note img,.note .ini{width:28px;height:28px;border-radius:50%}
.nhead{display:flex;gap:10px;align-items:baseline;font-size:13px}
.nhead span{color:var(--muted);font-size:12px}
.note p{margin:2px 0 0;white-space:pre-wrap;color:var(--ink)}
.ndel{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:12px}
.ndel:hover{color:var(--h-red)}
.nempty{margin:0;color:var(--muted)}

.tcell{gap:4px}
.upd{flex:none;display:inline-flex;align-items:center;gap:4px;border:1px solid transparent;background:transparent;color:var(--muted);border-radius:6px;padding:4px 6px;font-size:12px;font-weight:700}
.upd:hover,.upd:focus-visible{border-color:var(--line);color:var(--accent)}
.upd.has{color:var(--accent)}
#drawer .scrim{position:fixed;inset:0;background:rgba(10,14,24,.45);border:0;padding:0;z-index:40;cursor:default}
#drawer .panel{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:41;display:flex;flex-direction:column}
.phead{display:flex;gap:12px;align-items:flex-start;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 12px;border-bottom:1px solid var(--line)}
.pmain{flex:1;min-width:0}
.pprop{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.phead h2{margin:4px 0 0;font-family:var(--f-display);font-size:22px;line-height:1.2;text-wrap:balance}
.px{flex:none;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2)}
.pmeta{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.pmeta b{color:var(--muted);font-weight:600}
.pbody{flex:1;overflow-y:auto;padding:16px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.ncompose.col{flex-direction:column;align-items:stretch}
.ncompose.col .btn{align-self:flex-end}

.bell{position:relative}
.bell.hot{border-color:var(--h-red);color:var(--ink)}
#bellN{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--h-red);color:#fff;font-size:12px;display:inline-grid;place-items:center}
.notify{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.nbtn{border:1px dashed var(--line-strong);background:transparent;color:var(--accent);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:700}
.nbtn:hover{border-style:solid}
.nchip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:3px 6px 3px 10px;font-size:12.5px;font-weight:600}
.nchip button{border:0;background:transparent;color:var(--muted);font-size:11px;padding:0 2px}
.nhint{font-size:12px;color:var(--muted)}
.newpill{font-style:normal;background:var(--h-red);color:#fff;border-radius:999px;padding:1px 7px;font-size:11px;font-weight:700;margin-left:6px}
.newpill.big{margin-left:0;font-size:12px;padding:3px 9px}
.atpill{font-style:normal;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 7px;font-size:11px;font-weight:700;margin-left:6px}
.upd.unread{color:var(--h-red)}
.upd.unread::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--h-red)}
.inb{display:grid;grid-template-columns:28px 1fr;gap:10px;text-align:left;width:100%;background:transparent;border:0;border-top:1px solid var(--line);padding:10px 4px;border-radius:6px}
.inb:hover{background:var(--surface-2)}
.inb.new{background:color-mix(in srgb,var(--h-red) 7%,transparent)}
.inb img,.inb .ini{width:28px;height:28px;border-radius:50%}
.ib{display:flex;flex-direction:column;gap:2px;min-width:0}
.it{font-size:13.5px}
.iw{font-size:12px;color:var(--muted)}
.ix{font-size:13px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}

.bighead{display:flex;align-items:center;gap:10px;margin:8px 0 12px}
.bighead h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.bighead::after{content:"";flex:1;height:1px;background:var(--line-strong)}
.bighead.acq{margin-top:34px}
.osec{margin-bottom:22px}
.osh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.osh h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:20px}
.osh span{color:var(--muted);font-size:14px;font-weight:600}
.osh .oc{margin-left:auto;font-family:var(--f-mono);font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.osec.hot{background:var(--h-yellow-soft);border:2px solid var(--h-yellow);border-radius:16px;padding:14px 14px 16px}
.osec.hot .osh h3{color:var(--h-yellow-ink)}
.osec.hot .osh span{color:var(--h-yellow-ink)}

.pbox.closing{position:relative;border:2px solid transparent;border-top:6px solid transparent;
  background:linear-gradient(var(--surface),var(--surface)) padding-box,
             linear-gradient(120deg,#f59e0b,#ef4444,#f59e0b,#fde047,#f59e0b) border-box;
  background-size:100% 100%,300% 300%;animation:shimmer 3.2s linear infinite, glow 2s ease-in-out infinite}
.pbox.closing .a{color:var(--ink)}
.ribbon{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;background:linear-gradient(90deg,#ef4444,#f59e0b);color:#fff;font-weight:800;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:5px 12px;box-shadow:0 4px 14px rgba(239,68,68,.35)}
.spark{width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1s ease-in-out infinite}
@keyframes shimmer{0%{background-position:0 0,0% 50%}100%{background-position:0 0,300% 50%}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.0),0 6px 18px rgba(245,158,11,.18)}50%{box-shadow:0 0 0 6px rgba(245,158,11,.18),0 10px 28px rgba(239,68,68,.25)}}
@keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
@media (prefers-reduced-motion: reduce){.pbox.closing,.spark{animation:none}}

/* Task table */
.table{overflow-x:auto;border-radius:10px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gc)}
.grid{display:grid;grid-template-columns:minmax(240px,1.2fr) 150px 140px 130px minmax(220px,1fr) 40px;min-width:880px}
.grid > div{border-bottom:1px solid var(--line);border-right:1px solid var(--line);min-height:40px;display:flex;align-items:center}
.grid > div:nth-child(6n){border-right:0}
.hcell{font-size:12px;font-weight:600;color:var(--muted);justify-content:center;background:var(--surface-2)}
.hcell.left{justify-content:flex-start;padding-left:14px}
.cell{padding:0 8px;min-width:0}
.cell.center{justify-content:center;padding:0}
.row-done .title-in{color:var(--muted);text-decoration:line-through}
.title-in,.note-in{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 8px;min-width:0;text-overflow:ellipsis}
.title-in:hover,.note-in:hover{border-color:var(--line)}
.title-in:focus,.note-in:focus{outline:0;border-color:var(--accent);background:var(--surface)}
.note-in{color:var(--ink-2);font-size:13px}
.pill{width:100%;height:100%;min-height:40px;border:0;font-weight:600;font-size:13px;display:grid;place-items:center;padding:0 6px;transition:filter .12s}
.pill:hover{filter:brightness(1.06)}
.pill.empty{background:transparent;color:var(--muted);font-weight:500}
.owner{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:100%;min-height:40px;border:0;background:transparent;padding:0 8px;overflow:hidden}
.owner img{width:24px;height:24px;border-radius:50%;flex:none}
.owner span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.owner .plus{width:24px;height:24px;border-radius:50%;border:1px dashed var(--line-strong);display:grid;place-items:center;color:var(--muted);flex:none}
.due{border:0;background:transparent;font-family:var(--f-mono);font-size:12px;width:100%;height:100%;min-height:40px;text-align:center;padding:0 6px}
.due.overdue{color:var(--s-stuck);font-weight:500}
.del{border:0;background:transparent;color:var(--muted);width:100%;height:100%;min-height:40px;opacity:.35;font-size:12px}
.del:hover,.del:focus-visible{opacity:1;color:var(--s-stuck)}
.del.confirm{opacity:1;background:var(--s-stuck);color:#fff;font-weight:600}
.addrow{grid-column:1 / -1;border-right:0 !important;padding:0 8px}
.addrow input{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:7px 8px}
.addrow input:focus{outline:0;border-color:var(--accent);background:var(--surface)}
.addrow input::placeholder{color:var(--muted)}
.foot{grid-column:1 / -1;border-bottom:0 !important;border-right:0 !important;min-height:34px !important;padding:0 14px;font-size:12px;color:var(--muted);gap:14px;background:var(--surface-2)}
.empty-row{grid-column:1 / -1;border-right:0 !important;padding:0 16px;color:var(--muted);font-size:13px}
.ini{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:700;color:#fff;letter-spacing:.02em}

/* New property form */
.newprop{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.newprop input,.newprop select{flex:1 1 200px;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--surface-2);min-width:0}
.newprop select{flex:0 1 170px}

/* Popover */
.pop{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px;width:230px;max-width:calc(100vw - 32px)}
.pop .opt{display:block;width:100%;border:0;border-radius:6px;padding:8px 10px;margin:3px 0;font-weight:600;text-align:center}
.pop .person{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;border-radius:6px;padding:6px 8px;text-align:left}
.pop .person:hover,.pop .person:focus-visible{background:var(--surface-2)}
.pop .person img{width:24px;height:24px;border-radius:50%}
.pop input{width:100%;height:32px;border:1px solid var(--line);border-radius:6px;padding:0 8px;background:var(--surface-2);margin-bottom:6px}
.pop .hint{color:var(--muted);font-size:12px;padding:6px 8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:9px 14px;border-radius:8px;font-weight:500;z-index:60;max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){.brand h1{font-size:22px}.battery{display:none}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Property Command Center</h1>
      <p>Tap a property to see its tasks and notes.</p>
    </div>
    <div class="tools">
      <label class="search" for="q"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search" autocomplete="off"></label>
      <button class="chip" id="f-mine" aria-pressed="false">My tasks</button>
      <button class="chip" id="f-done" aria-pressed="false">Show done</button>
      <button class="chip bell" id="bell" type="button" aria-label="Updates"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span>Updates</span><b id="bellN" hidden></b></button>
      <button class="btn" id="add-prop">+ Property</button>
    </div>
  </header>

  <div id="notice" class="notice" hidden></div>
  <form class="newprop" id="newprop" hidden>
    <input id="np-addr" placeholder="Street address, e.g. 820 28th St" autocomplete="off" required>
    <input id="np-city" placeholder="City, State ZIP" autocomplete="off">
    <select id="np-kind" aria-label="Type of deal">
      <option value="sell">Pending to close</option><option value="rehab">Under construction</option><option value="listed">Active (no buyer yet)</option><option value="buy">Acquisition</option>
    </select>
    <button class="btn" type="submit">Add property</button>
    <button class="btn ghost" type="button" id="np-cancel">Cancel</button>
  </form>
  <nav class="jump" id="jump" role="tablist" aria-label="Properties"></nav>
  <div class="groups" id="groups"><div class="notice">Loading the board…</div></div>

</div>
<div id="drawer" hidden></div>
<div id="pop" class="pop" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
const STATUS = [
  {k:"todo", label:"Not started"},
  {k:"working", label:"Working on it"},
  {k:"stuck", label:"Stuck"},
  {k:"done", label:"Done"}];
const PRIORITY = [
  {k:"low", label:"Low"},{k:"medium", label:"Medium"},{k:"high", label:"High"},{k:"critical", label:"Critical"}];
const HEALTH = [
  {k:"green", label:"On track"},
  {k:"yellow", label:"Needs action"},
  {k:"red", label:"Blocked — do not proceed"},
  {k:"grey", label:"Needs update"}];
const CHECK = [
  {k:"done", label:"Done"},
  {k:"waiting", label:"In progress"},
  {k:"missing", label:"Missing"},
  {k:"unknown", label:"Confirm"},
  {k:"na", label:"N/A"}];
const KIND = {buy:"Acquisition", sell:"Pending to close", rehab:"Under construction", listed:"Active (no buyer yet)", watch:"SF opportunity"};
const HRANK = {red:0, yellow:1, grey:2, green:3};
const GCOLORS = ["--g1","--g2","--g3","--g4","--g5","--g6"];

const S = { db:null, user:null, me:null, canWrite:true, openTask:null, inbox:false, inboxSeen:0, mcp:null, lastSeen:0, meName:"A teammate", pend:{}, props:[], tasks:[], notes:[], ready:{p:false,t:false},
  sel:null, q:"", mine:false, hideDone:true, kpi:null, collapsed:new Set(), info:new Set(), pendingRender:false };
try{ const c = JSON.parse(localStorage.getItem("tdb-ui")||"{}"); (c.collapsed||[]).forEach(x=>S.collapsed.add(x)); S.hideDone=!c.showDone; }catch(e){}
try{ const hsh=location.hash.slice(1); S.sel = hsh || localStorage.getItem("tdb-sel") || "all"; }catch(e){ S.sel="all"; }
function saveUI(){ try{ localStorage.setItem("tdb-ui", JSON.stringify({collapsed:[...S.collapsed], showDone:!S.hideDone})); }catch(e){} }

const $ = (s,r=document)=>r.querySelector(s);
function h(tag, attrs={}, ...kids){
  const el = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(v==null || v===false) continue;
    if(k==="class") el.className=v;
    else if(k==="text") el.textContent=v;
    else if(k==="style") el.style.cssText=v;
    else if(k==="value") el.value=v;
    else if(k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v===true?"":v);
  }
  for(const c of kids.flat()){ if(c==null||c===false) continue; el.append(c.nodeType?c:document.createTextNode(String(c))); }
  return el;
}
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true, 2600); }
function notice(msg, tone){ const n=$("#notice"); if(!msg){n.hidden=true;return;} n.textContent=msg; n.dataset.tone=tone||""; n.hidden=false; }
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function today(){ return ymd(new Date()); }
function daysUntil(iso){ const [y,m,d]=iso.split("-").map(Number); const t=new Date(); const a=Date.UTC(y,m-1,d), b=Date.UTC(t.getFullYear(),t.getMonth(),t.getDate()); return Math.round((a-b)/86400000); }
function fmtDate(iso){ const [y,m,d]=iso.split("-").map(Number); return new Date(Date.UTC(y,m-1,d)).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",timeZone:"UTC"}); }
function ago(ms){ if(!ms) return ""; const s=(Date.now()-ms)/1000; if(s<90) return "just now"; if(s<3600) return Math.round(s/60)+" min ago"; if(s<86400) return Math.round(s/3600)+" h ago"; return new Date(ms).toLocaleDateString("en-US",{month:"short",day:"numeric"}); }
const isDeal = p => p.kind==="buy" || p.kind==="sell";

async function write(fn, okMsg){
  try{ await fn(); if(okMsg) toast(okMsg); return true; }
  catch(e){
    const code = e && e.code;
    if(code==="invalid_argument" && S.canWrite){ S.canWrite=false; notice("You can view this board but not change it. Ask Bryan for “Can interact” access.", "warn"); render(); }
    else if(code==="quota_exceeded") toast("The board is full. Delete finished tasks to make room.");
    else if(code==="resource_exhausted") toast("Too many changes at once. Wait a moment and try again.");
    else toast("That change didn't save. Check your connection and try again.");
    return false;
  }
}
function stampFields(){ return {updatedAt:Date.now(), updatedBy:S.me||null, updatedByName:null}; }
function saveProp(pid, fields, msg){ return write(()=>S.db.doc("properties/"+pid).update({...fields, ...stampFields()}), msg); }

/* ---------- derived ---------- */
function openTasks(pid){ return S.tasks.filter(t=>t.property===pid && t.status!=="done"); }
function overdueTasks(){ const d=today(); return S.tasks.filter(t=>t.due && t.due<d && t.status!=="done" && S.props.some(p=>p.id===t.property)); }
function closingSoon(p){ return isDeal(p) && p.closingDate && daysUntil(p.closingDate)>=0 && daysUntil(p.closingDate)<=7; }
function activeProps(){ return S.props.filter(p=>p.kind!=="watch" && !p.closed); }
function visibleTasks(pid){
  const q = S.q.trim().toLowerCase();
  return S.tasks.filter(t=>{
    if(t.property!==pid) return false;
    if(S.hideDone && t.status==="done") return false;
    if(S.mine && (!S.me || t.owner!==S.me)) return false;
    if(S.kpi==="overdue" && !(t.due && t.due<today() && t.status!=="done")) return false;
    if(q && !((t.title||"")+" "+(t.notes||"")+" "+(t.ownerName||"")).toLowerCase().includes(q)) return false;
    return true;
  });
}
function propMatches(p){
  if(S.kpi==="week" && !closingSoon(p)) return false;
  if(S.kpi==="blocked" && p.health!=="red") return false;
  if(S.kpi==="overdue" && !overdueTasks().some(t=>t.property===p.id)) return false;
  const q=S.q.trim().toLowerCase();
  if(q){
    const hay=[p.address,p.city,p.blocker,p.missing,p.nextAction,p.nextOwner,p.stageLabel,p.escrow,
      ...Object.values(p.checks||{}).map(c=>(c.label||"")+" "+(c.note||"")),
      ...S.tasks.filter(t=>t.property===p.id).map(t=>(t.title||"")+" "+(t.notes||"")+" "+(t.ownerName||""))].join(" ").toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}
function sortedChecks(p){ return Object.entries(p.checks||{}).map(([id,c])=>({id,...c})).sort((a,b)=>(a.order||0)-(b.order||0)); }

function editing(){ const a=document.activeElement; return a && a.closest && a.closest("#groups,#drawer") && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName); }
function flush(){ setTimeout(()=>{ if(S.pendingRender && !editing()) render(); },0); }

/* ---------- render ---------- */
async function render(){ await renderMain(); updateBell(); if(!S.pendingRender && S.ready.p && S.ready.t){ const ids=new Set(); S.tasks.forEach(t=>t.owner&&ids.add(t.owner)); S.notes.forEach(n=>n.author&&ids.add(n.author)); const people=S.user&&ids.size?await S.user.profiles([...ids]):{}; if(!editing()) renderDrawer(people); } }
async function renderMain(){
  if(editing()){ S.pendingRender=true; return; }
  S.pendingRender=false;
  if(!S.ready.p || !S.ready.t) return;
  const ids = new Set();
  S.tasks.forEach(t=>t.owner && ids.add(t.owner));
  S.props.forEach(p=>p.updatedBy && ids.add(p.updatedBy));
  S.notes.forEach(n=>n.author && ids.add(n.author));
  const people = S.user && ids.size ? await S.user.profiles([...ids]) : {};
  if(editing()){ S.pendingRender=true; return; }

  const KORD={sell:0,rehab:1,listed:2,buy:3};
  const act = activeProps().slice().sort((a,b)=>{
    const kk=(KORD[a.kind]??9)-(KORD[b.kind]??9); if(kk) return kk;
    const r=(HRANK[a.health]??2)-(HRANK[b.health]??2); if(r) return r;
    const da=a.closingDate||"9999", db=b.closingDate||"9999"; if(da!==db) return da<db?-1:1;
    return (a.order||0)-(b.order||0);
  });
  const tab=(id,label,dot)=>h("button",{role:"tab","aria-selected":String((S.sel||"all")===id),onclick:()=>select(id)},
    dot?h("i",{class:"hdot "+dot,"aria-hidden":"true"}):null, label);
  $("#jump").replaceChildren(tab("all","All properties"), ...act.map(p=>tab(p.id,p.address,p.health||"grey")));
  const root=$("#groups");
  const one = S.sel && S.sel!=="all" ? act.find(p=>p.id===S.sel) : null;
  if(one){ S.collapsed.delete(one.id); root.replaceChildren(h("button",{class:"back",onclick:()=>select("all")},"← All properties"), renderGroup(one,people)); return; }
  const shown = act.filter(propMatches);
  if(!act.length){ root.replaceChildren(h("div",{class:"notice",text:"No properties yet. Use “+ Property” to add the first one."})); return; }
  if(!shown.length){ root.replaceChildren(h("div",{class:"notice",text:"No properties match this filter."})); return; }
  const card=p=>{
      const hk=p.health||"grey", n=p.closingDate?daysUntil(p.closingDate):null;
      const gc=`var(${GCOLORS[(p.colorIndex ?? 0) % GCOLORS.length]})`;
      const closing = p.kind==="sell";
      return h("button",{class:"pbox"+(closing?" closing":""),role:"listitem",style:`--gc:${gc}`,onclick:()=>select(p.id),"aria-label":"Open "+p.address},
        closing?h("span",{class:"ribbon"}, h("i",{class:"spark","aria-hidden":"true"}), n==null?"Closing":n<0?"Closing date passed":n===0?"Closing today":n===1?"Closing tomorrow":`Closing in ${n} days`):null,
        h("span",{class:"a"}, p.address, h("small",{text:p.city||""})),
        h("span",{class:"row1"}, h("span",{class:"health "+hk}, h("i",{class:"hdot "+hk,"aria-hidden":"true"}), HEALTH.find(x=>x.k===hk).label),
          (()=>{ const nu=unread().filter(x=>x.property===p.id).length; return nu?h("span",{class:"newpill big",text:nu+" new comment"+(nu===1?"":"s")}):null; })(),
          p.closingDate?h("span",{class:"dchip"+(n<0?" past":n<=7?" soon":""),text:"Closes "+fmtDate(p.closingDate)+(n<0?" (passed)":n===0?" (today)":" ("+n+"d)")}):null),
        p.blocker?h("span",{class:"t red"}, h("b",{text:"Blocker"}), p.blocker):null,
        (()=>{ const ot=openTasks(p.id).length; return h("span",{class:"t"}, h("b",{text:"Not done"}), `${ot} task${ot===1?"":"s"}`); })(),
        h("span",{class:"go",text:"Open property →"}));
  };
  const sec=(cls,title,sub,list)=>list.length?h("section",{class:"osec "+cls},
      h("div",{class:"osh"}, h("h3",{text:title}), sub?h("span",{text:sub}):null, h("span",{class:"oc",text:String(list.length)})),
      h("div",{class:"ov",role:"list"}, ...list.map(card))):null;
  const of=k=>shown.filter(p=>p.kind===k);
  root.replaceChildren(
    h("div",{class:"bighead disp"}, h("h2",{text:"Disposition"})),
    sec("hot","High priority · Pending to close","Money to collect",of("sell")),
    sec("","Under construction","",of("rehab")),
    sec("","Active","No buyer yet",of("listed")),
    of("buy").length?h("div",{class:"bighead acq"}, h("h2",{text:"Acquisition"})):null,
    sec("","Acquisition","",of("buy")));
}

function select(id){ S.sel=id; try{ localStorage.setItem("tdb-sel",id); }catch(e){} try{ history.replaceState(null,"",id==="all"?location.pathname+location.search:"#"+id); }catch(e){} render(); scrollTo({top:0}); }

function healthBtn(p){

async function addNote(pid, ta){
  const text=ta.value.trim(); if(!text) return;
  const key="p-"+pid, rec=(S.pend[key]||[]).slice();
  const ok=await write(()=>S.db.collection("notes").add({property:pid,text,author:S.me||null,mentions:rec.map(r=>r.id).filter(Boolean),createdAt:Date.now()}), rec.length?null:"Note posted");
  if(!ok) return;
  ta.value=""; S.pend[key]=[]; refreshNotify(key); saveProp(pid,{});
  const pr=S.props.find(x=>x.id===pid)||{};
  sendEmails(rec, `${S.meName} posted a note on ${pr.address||"a property"}`, `${S.meName} wrote:\n\n${text}\n\nProperty: ${pr.address||""}\nOpen the board: ${BOARD_URL}#${pid}`);
}

async function removeCheck(pid, cid){
  await write(async()=>{
    const ref=S.db.doc("properties/"+pid), snap=await ref.get();
    if(!snap.exists) return;
    const d=JSON.parse(JSON.stringify(snap.data()));
    if(d.checks) delete d.checks[cid];
    await ref.set({...d, ...stampFields()});
  },"Item removed");
}

async function addCheck(p, input){
  const label=input.value.trim(); if(!label) return;
  input.value="";
  const id="c"+Date.now().toString(36);
  const order=sortedChecks(p).reduce((m,c)=>Math.max(m,c.order||0),0)+1;
  await saveProp(p.id,{checks:{[id]:{label,state:"missing",note:"",order}}});
  const again=document.getElementById("cadd-"+p.id); if(again) again.focus();
}

async function openNotify(anchor,key){
  const list=h("div",{}), inp=h("input",{id:"notify-search",placeholder:"Name or email",autocomplete:"off"});
  pop.replaceChildren(inp,list); place(anchor);
  const add=r=>{ const arr=S.pend[key]=S.pend[key]||[]; if(!arr.some(x=>(r.id&&x.id===r.id)||(r.email&&x.email===r.email))) arr.push(r); closePop(); refreshNotify(key); };
  async function paint(q){
    const hits=S.user?await S.user.search(q):[];
    if(inp.value!==q) return;
    const qt=q.trim(), isEm=EMAIL_RE.test(qt);
    list.replaceChildren(
      ...hits.filter(x=>!x.isMe).map(x=>h("button",{class:"person",onclick:()=>add({id:x.id,email:x.email||null,label:first(x.name)||x.email||"Teammate"})}, h("img",{src:x.avatarUrl,alt:""}), h("span",{text:first(x.name)}))),
      isEm?h("button",{class:"person",onclick:()=>add({id:null,email:qt,label:qt})}, badge(qt), h("span",{}, "Email ", h("b",{text:qt}))):null,
      (!hits.filter(x=>!x.isMe).length && !isEm)?h("div",{class:"hint",text:qt?"No teammate found. Type their full email address.":"Type a teammate's name or an email address."}):null);
    place(anchor);
  }
  inp.addEventListener("input",()=>paint(inp.value));
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); const v=inp.value.trim(); if(EMAIL_RE.test(v)) add({id:null,email:v,label:v}); } });
  inp.focus(); paint("");
}
async function sendEmails(recips, subject, body){
  if(!recips.length) return;
  const to=[...new Set(recips.map(r=>r.email).filter(Boolean))];
  const noMail=recips.filter(r=>!r.email).map(r=>r.label);
  if(!S.mcp){ toast("Posted. Email isn't available in this view, so they'll see it in Updates."); return; }
  if(!to.length){ toast("Posted. No email address for "+noMail.join(", ")+", so they'll see it in Updates."); return; }
  try{
    await S.mcp.callTool("Gmail","send_message",{to,subject,body});
    toast("Posted and emailed "+to.length+(to.length===1?" person":" people")+(noMail.length?" (no email for "+noMail.join(", ")+")":""));
  }catch(e){
    const c=e&&e.code;
    if(c==="server_not_connected") toast("Posted. To email people, add Gmail in claude.ai Settings → Connectors.");
    else if(c==="needs_reauth") toast("Posted. Reconnect Gmail in claude.ai Settings → Connectors to send emails.");
    else if(c==="not_in_manifest") toast("Posted. Gmail isn't allowed for this page, so no email went out.");
    else if(c==="blocked_by_policy"||c==="approval_required") toast("Posted. Your organization blocks sending email from this page.");
    else if(c==="selection_required") toast("Posted. Choose which Gmail account to use, then post again to email.");
    else toast("Posted, but the email may not have gone out. Check your Gmail Sent folder.");
  }
}

function first(name){ return String(name||"").trim().split(/\s+/)[0]||""; }
function initials(name){ return name.trim().split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase(); }
function nameColor(name){ let x=0; for(const c of name.toLowerCase()) x=(x*31+c.charCodeAt(0))>>>0; return `var(${GCOLORS[x%GCOLORS.length]})`; }
function badge(name){ return h("i",{class:"ini",style:`background:${nameColor(name)}`,text:initials(name)||"?","aria-hidden":"true"}); }
function knownNames(){ const m=new Map(); S.tasks.forEach(t=>{ const n=(t.ownerName||"").trim(); if(n) m.set(n.toLowerCase(), n); }); return [...m.values()].sort((a,b)=>a.localeCompare(b)); }

    onkeydown:e=>{ if(e.key==="Enter") e.target.blur(); if(e.key==="Escape"){ e.target.value=t.title||""; e.target.blur(); } },
    onblur:e=>{ const v=e.target.value.trim(); if(v && v!==t.title) write(()=>doc().update({title:v,updatedAt:Date.now()})); else if(!v) e.target.value=t.title||""; flush(); }}), updBtn(t)));

  const prof = t.owner ? people[t.owner] : null, oname=(t.ownerName||"").trim();
  grid.append(h("div",{class:"cell center",role:"cell"},h("button",{class:"owner",id:"o-"+t.id,disabled:ro||null,"aria-label":prof?("Owner: "+(prof.name||"Someone")):oname?("Owner: "+oname):"Assign owner",onclick:e=>openOwner(e.currentTarget,t)},
    prof ? [h("img",{src:prof.avatarUrl,alt:""}), h("span",{text:prof.isMe?"You":(first(prof.name)||"Someone"),title:prof.name||""})]
         : oname ? [badge(oname), h("span",{text:first(oname),title:oname})] : h("span",{class:"plus",text:"+"}))));

  grid.append(h("div",{class:"cell center",role:"cell"}, h("button",{class:"pill",id:"s-"+t.id,disabled:ro||null,style:`background:var(--s-${st.k});color:var(--s-${st.k}-ink)`,
    onclick:e=>openList(e.currentTarget,STATUS.map(x=>({...x,style:`background:var(--s-${x.k});color:var(--s-${x.k}-ink)`})),k=>write(()=>doc().update({status:k,updatedAt:Date.now()}), k==="done"?"Marked done":null))}, st.label)));


  const overdue = t.due && t.status!=="done" && t.due < today();
  grid.append(h("div",{class:"cell center",role:"cell"}, h("input",{type:"date",class:"due"+(overdue?" overdue":""),id:"d-"+t.id,value:t.due||"",readonly:ro||null,"aria-label":"Due date",
    onchange:e=>write(()=>doc().update({due:e.target.value||null})), onblur:()=>flush()})));

  grid.append(h("div",{class:"cell",role:"cell"}, h("input",{class:"note-in",id:"n-"+t.id,value:t.notes||"",placeholder:ro?"":"Add a note",readonly:ro||null,"aria-label":"Notes",
    onkeydown:e=>{ if(e.key==="Enter") e.target.blur(); },
    onblur:e=>{ const v=e.target.value; if(v!==(t.notes||"")) write(()=>doc().update({notes:v,updatedAt:Date.now()})); flush(); }})));

  const del=h("button",{class:"del",id:"x-"+t.id,disabled:ro||null,"aria-label":"Delete task "+(t.title||""),title:"Delete task"},"✕");
  del.addEventListener("click",()=>{
    if(del.classList.contains("confirm")){ write(()=>doc().delete(),"Task deleted"); return; }
    del.classList.add("confirm"); del.textContent="Sure?"; del.style.fontSize="11px";
    setTimeout(()=>{ if(del.isConnected){ del.classList.remove("confirm"); del.textContent="✕"; del.style.fontSize=""; } },3000);
  });
  grid.append(h("div",{class:"cell center",role:"cell"},del));
}

async function addTask(pid, input){
  const title=input.value.trim(); if(!title) return;
  input.value="";
  await write(()=>S.db.collection("tasks").add({property:pid,title,status:"todo",priority:null,owner:null,ownerName:null,due:null,notes:"",createdBy:S.me||null,createdAt:Date.now()}));
  const again=document.getElementById("add-"+pid); if(again) again.focus();
}

/* ---------- popovers ---------- */
const pop=$("#pop");
function place(anchor){
  const r=anchor.getBoundingClientRect(); pop.hidden=false;
  const w=pop.offsetWidth, hgt=pop.offsetHeight;
  const left=Math.min(Math.max(8,r.left+r.width/2-w/2), innerWidth-w-8);
  let top=r.bottom+6; if(top+hgt>innerHeight-8) top=Math.max(8,r.top-hgt-6);
  pop.style.left=left+"px"; pop.style.top=top+"px";
}
function closePop(){ pop.hidden=true; pop.replaceChildren(); flush(); }
document.addEventListener("pointerdown",e=>{ if(!pop.hidden && !pop.contains(e.target)) closePop(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !pop.hidden) closePop(); });
addEventListener("scroll",()=>{ if(!pop.hidden) closePop(); },{passive:true,capture:true});

function openList(anchor, list, pick){
  pop.replaceChildren(...list.map(o=>h("button",{class:"opt",style:o.style||"",onclick:()=>{closePop();pick(o.k);}},o.label)));
  place(anchor); pop.querySelector("button").focus();
}

async function openOwner(anchor, t){
  const list=h("div",{});
  const inp=h("input",{id:"owner-search",placeholder:"Type any name",autocomplete:"off",maxlength:"60"});
  pop.replaceChildren(inp,list); place(anchor);
  const doc=S.db.doc("tasks/"+t.id);
  const setName=n=>{ n=first(n); if(!n) return; closePop(); write(()=>doc.update({owner:null,ownerName:n})); };
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); const v=inp.value.trim(); if(v) setName(v); } });
  async function paint(q){
    const ql=q.trim().toLowerCase();
    const names=knownNames().filter(n=>!ql||n.toLowerCase().includes(ql));
    const hits=S.user ? await S.user.search(q) : [];
    if(inp.value!==q) return;
    const hitFirst=new Set(hits.map(p=>first(p.name).toLowerCase()));
    const typed=names.filter(n=>!hitFirst.has(first(n).toLowerCase()));
    const qf=first(q).toLowerCase();
    const exact=qf && (typed.some(n=>first(n).toLowerCase()===qf) || hitFirst.has(qf));
    list.replaceChildren(
      q.trim() && !exact ? h("button",{class:"person",onclick:()=>setName(first(q))}, badge(first(q)), h("span",{}, "Assign ", h("b",{text:first(q)}))) : null,
      ...hits.map(p=>h("button",{class:"person",title:p.name||"",onclick:()=>{closePop();write(()=>doc.update({owner:p.id,ownerName:null}));}}, h("img",{src:p.avatarUrl,alt:""}), h("span",{text:(first(p.name)||"Someone")+(p.isMe?" (you)":"")}))),
      ...typed.map(n=>h("button",{class:"person",onclick:()=>setName(first(n))}, badge(n), h("span",{text:first(n)}))),
      !q.trim() && !names.length && !hits.length ? h("div",{class:"hint",text:"Type a name and press Enter."}) : null,
      (t.owner||t.ownerName)?h("button",{class:"person",style:"color:var(--muted)",onclick:()=>{closePop();write(()=>doc.update({owner:null,ownerName:null}));}},"Unassign"):null);
    place(anchor);
  }
  inp.addEventListener("input",()=>paint(inp.value));
  inp.focus(); paint("");
}

/* ---------- controls ---------- */
$("#bell").addEventListener("click",openInbox);
$("#q").addEventListener("input",e=>{ S.q=e.target.value; render(); });
$("#q").addEventListener("keydown",e=>{ if(e.key==="Escape"){ e.target.value=""; S.q=""; render(); } });
const fm=$("#f-mine"), fd=$("#f-done");
fd.setAttribute("aria-pressed",String(!S.hideDone));
fm.addEventListener("click",()=>{ S.mine=!S.mine; fm.setAttribute("aria-pressed",String(S.mine)); render(); });
fd.addEventListener("click",()=>{ S.hideDone=!S.hideDone; fd.setAttribute("aria-pressed",String(!S.hideDone)); saveUI(); render(); });
const np=$("#newprop");
$("#add-prop").addEventListener("click",()=>{ np.hidden=false; $("#np-addr").focus(); });
$("#np-cancel").addEventListener("click",()=>{ np.hidden=true; np.reset(); });
np.addEventListener("submit",async e=>{
  e.preventDefault();
  const address=$("#np-addr").value.trim(), city=$("#np-city").value.trim(), kind=$("#np-kind").value; if(!address) return;
  const order = S.props.reduce((m,p)=>Math.max(m,p.order||0),0)+1;
  const ok = await write(()=>S.db.collection("properties").add({address,city,kind,health:"grey",order,colorIndex:order%GCOLORS.length,createdAt:Date.now(),blocker:"",missing:"",nextAction:"",checks:{},...stampFields()}),"Property added");
  if(ok){ np.reset(); np.hidden=true; }
});

/* ---------- boot ---------- */
(async function boot(){
  const [db,user,mcp] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("mcp")]);
  S.mcp=mcp;
  try{ S.lastSeen=Number(localStorage.getItem("tdb-seen"))||0; }catch(e){}
  if(!db){ $("#groups").replaceChildren(h("div",{class:"notice",text:"The shared board can't load in this view. Open it on claude.ai while signed in to see and edit it."})); $("#add-prop").hidden=true; return; }
  S.db=db; S.user=user;
  if(user){ S.me = await user.id(); try{ S.meName=first((await user.me()).name)||"A teammate"; }catch(e){}
    if(S.me){ try{ const st=await db.doc("data/users/"+S.me+"/state").get(); if(st.exists) S.lastSeen=Math.max(S.lastSeen, st.data().lastSeen||0); }catch(e){} } const cw = await user.can("data.write"); if(cw===false){ S.canWrite=false; notice("You can view this board but not change it. Ask Bryan for “Can interact” access.","warn"); } }
  if(!S.canWrite) $("#add-prop").hidden=true;
  if(!S.me) fm.hidden=true;
  const onErr = e=>{ if(e && e.code!=="revoked") notice("Live updates stopped. Reload the page to reconnect."); };
  db.collection("properties").orderBy("order").onSnapshot(snap=>{ S.props=snap.docs.map(d=>({id:d.id,...d.data()})); S.ready.p=true; render(); }, onErr);
  db.collection("tasks").orderBy("createdAt").onSnapshot(snap=>{ S.tasks=snap.docs.map(d=>({id:d.id,...d.data()})); S.ready.t=true; render(); }, onErr);
  db.collection("notes").orderBy("createdAt","desc").limit(500).onSnapshot(snap=>{ S.notes=snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, onErr);
  setInterval(()=>{ if(!editing() && pop.hidden) render(); }, 60000);
})();
</script>
